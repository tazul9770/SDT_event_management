{% extends "base.html" %}
{% load static %}
{% block title %}Password Changed | EventPro{% endblock %}
{% block content %}

<div class="min-h-[85vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm text-center">

    <div class="bg-white rounded-2xl border border-gray-100 shadow-xl p-8 sm:p-10">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 mb-6">
        <i class="fas fa-check text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-3">Password Updated!</h2>
      <p class="text-gray-600 mb-6">Your password has been changed successfully.</p>
      <a href="{% url 'profile' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 text-white font-semibold rounded-xl hover:from-emerald-700 hover:to-emerald-800 transition-all">
        <i class="fas fa-user"></i> Go to Profile
      </a>
    </div>

  </div>
</div>
{% endblock %}
